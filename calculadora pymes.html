<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco IPSY – Calculadora Empresarial</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #E1F0FF 0%, #F4F9FF 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem;
        }
        .pantalla {
            background: #FFFFFF; border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0,76,151,0.08), 0 4px 12px rgba(0,76,151,0.04);
            max-width: 600px; width: 100%; padding: 2.5rem 2.2rem;
            text-align: center; transition: transform 0.25s;
        }
        .pantalla:hover { transform: translateY(-3px); box-shadow: 0 28px 55px rgba(0,76,151,0.12); }
        .icono-banco {
            display: inline-flex; align-items: center; justify-content: center;
            width: 80px; height: 80px; background: #E1F0FF; border-radius: 50%;
            font-size: 2.5rem; color: #004C97; margin-bottom: 1.2rem;
        }
        h1 { font-size: 2rem; font-weight: 700; color: #292E38; margin-bottom: 0.5rem; }
        .subtitulo { font-size: 1rem; color: #6F7583; margin-bottom: 2rem; }

        .campo {
            margin-bottom: 1.2rem; text-align: left;
        }
        .campo label {
            display: block; font-weight: 600; font-size: 0.9rem; color: #292E38; margin-bottom: 0.4rem;
        }
        .campo input, .campo select {
            width: 100%; padding: 12px 14px; border: 1.5px solid #D9E7F8;
            border-radius: 10px; font-size: 1rem; font-family: 'Inter', sans-serif;
            background: #FBFDFF; transition: border-color 0.2s;
        }
        .campo input:focus, .campo select:focus {
            outline: none; border-color: #004C97; box-shadow: 0 0 0 3px rgba(0,76,151,0.12);
        }
        .boton-primario {
            display: inline-block; background-color: #004C97; color: #FFFFFF;
            font-weight: 600; font-size: 1rem; padding: 13px 32px; border-radius: 12px;
            border: none; box-shadow: 0 4px 14px rgba(0,76,151,0.18);
            transition: all 0.25s; cursor: pointer; width: 100%; margin-top: 0.5rem;
        }
        .boton-primario:hover { background-color: #1677D8; transform: translateY(-1px); }
        .resultado {
            background: #F8FBFF; border-radius: 16px; padding: 1.5rem;
            margin-top: 1.8rem; text-align: left; border: 1px solid #E1F0FF;
        }
        .resultado h3 { font-size: 1.2rem; color: #292E38; margin-bottom: 1rem; font-weight: 600; }
        .resultado p { font-size: 0.95rem; color: #444C5E; margin-bottom: 0.5rem; }
        .resultado span { font-weight: 700; color: #004C97; }
        .oculto { display: none; }
        .volver {
            display: inline-block; margin-top: 1.5rem; color: #004C97;
            font-weight: 500; text-decoration: none;
        }
        .volver:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .pantalla { padding: 2rem 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="pantalla">
    <div class="icono-banco"><i class="fas fa-calculator"></i></div>
    <h1>Calculadora Empresarial</h1>
    <p class="subtitulo">Simulá Factoring, Leasing o Capital de Trabajo</p>

    <form id="formCalculo">
        <div class="campo">
            <label for="tipoFinanciamiento">Tipo de financiamiento</label>
            <select id="tipoFinanciamiento" required onchange="cambiarFormulario()">
                <option value="">Seleccioná una opción</option>
                <option value="factoring">Factoring</option>
                <option value="leasing">Leasing</option>
                <option value="capital_trabajo">Capital de Trabajo</option>
            </select>
        </div>

        <!-- Campos dinámicos -->
        <div id="camposEspecificos"></div>

        <button type="submit" class="boton-primario" id="btnCalcular" disabled>
            <i class="fas fa-calculator"></i> Calcular
        </button>
    </form>

    <!-- Resultado -->
    <div id="resultado" class="resultado oculto"></div>

    <a href="pymes.html" class="volver"><i class="fas fa-arrow-left"></i> Volver a Pymes</a>
</div>

<script>
    function formatearNumero(num) {
        return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Habilitar/deshabilitar botón según selección
    document.getElementById('tipoFinanciamiento').addEventListener('change', function() {
        document.getElementById('btnCalcular').disabled = (this.value === '');
    });

    function cambiarFormulario() {
        const tipo = document.getElementById('tipoFinanciamiento').value;
        const contenedor = document.getElementById('camposEspecificos');
        let html = '';
        if (tipo === 'factoring') {
            html = `
                <div class="campo">
                    <label for="montoFactura">Valor de la factura ($)</label>
                    <input type="number" id="montoFactura" required min="1" step="0.01" placeholder="Ej: 10,000">
                </div>
                <div class="campo">
                    <label for="anticipo">Porcentaje de anticipo (%)</label>
                    <input type="number" id="anticipo" required min="0" max="100" step="0.01" placeholder="Ej: 80">
                </div>
                <div class="campo">
                    <label for="tasaFactoring">Tasa de descuento anual (%)</label>
                    <input type="number" id="tasaFactoring" required min="0" step="0.01" placeholder="Ej: 12">
                </div>
                <div class="campo">
                    <label for="plazoFactoring">Plazo de la factura (días)</label>
                    <input type="number" id="plazoFactoring" required min="1" step="1" placeholder="Ej: 60">
                </div>`;
        } else if (tipo === 'leasing') {
            html = `
                <div class="campo">
                    <label for="valorActivo">Valor del activo ($)</label>
                    <input type="number" id="valorActivo" required min="1" step="0.01" placeholder="Ej: 50,000">
                </div>
                <div class="campo">
                    <label for="valorResidual">Valor residual ($)</label>
                    <input type="number" id="valorResidual" required min="0" step="0.01" placeholder="Ej: 5,000">
                </div>
                <div class="campo">
                    <label for="tasaLeasing">Tasa de interés anual (%)</label>
                    <input type="number" id="tasaLeasing" required min="0" step="0.01" placeholder="Ej: 10">
                </div>
                <div class="campo">
                    <label for="plazoLeasing">Plazo (meses)</label>
                    <input type="number" id="plazoLeasing" required min="1" step="1" placeholder="Ej: 36">
                </div>`;
        } else if (tipo === 'capital_trabajo') {
            html = `
                <div class="campo">
                    <label for="montoCapital">Monto de la línea de crédito ($)</label>
                    <input type="number" id="montoCapital" required min="1" step="0.01" placeholder="Ej: 30,000">
                </div>
                <div class="campo">
                    <label for="tasaCapital">Tasa de interés anual (%)</label>
                    <input type="number" id="tasaCapital" required min="0" step="0.01" placeholder="Ej: 15">
                </div>
                <div class="campo">
                    <label for="plazoCapital">Periodo de utilización (días)</label>
                    <input type="number" id="plazoCapital" required min="1" step="1" placeholder="Ej: 90">
                </div>`;
        }
        contenedor.innerHTML = html;
    }

    document.getElementById('formCalculo').addEventListener('submit', function(e) {
        e.preventDefault();
        const tipo = document.getElementById('tipoFinanciamiento').value;
        let resultadoHTML = '';
        
        if (tipo === 'factoring') {
            const factura = parseFloat(document.getElementById('montoFactura').value);
            const anticipoPorc = parseFloat(document.getElementById('anticipo').value) / 100;
            const tasa = parseFloat(document.getElementById('tasaFactoring').value) / 100;
            const dias = parseInt(document.getElementById('plazoFactoring').value);
            const anticipo = factura * anticipoPorc;
            const costo = anticipo * tasa * dias / 360;
            const neto = anticipo - costo;
            const tasaEfectiva = (costo / anticipo) * (360 / dias) * 100;
            resultadoHTML = `
                <h3>Resultado Factoring</h3>
                <p>Anticipo recibido: <span>$${formatearNumero(anticipo)}</span></p>
                <p>Costo del factoring: <span>$${formatearNumero(costo)}</span></p>
                <p>Neto acreditado: <span>$${formatearNumero(neto)}</span></p>
                <p>Tasa efectiva anual: <span>${tasaEfectiva.toFixed(2)}%</span></p>`;
        } else if (tipo === 'leasing') {
            const valorActivo = parseFloat(document.getElementById('valorActivo').value);
            const valorResidual = parseFloat(document.getElementById('valorResidual').value);
            const tasa = parseFloat(document.getElementById('tasaLeasing').value) / 100 / 12;
            const meses = parseInt(document.getElementById('plazoLeasing').value);
            const valorFuturo = valorResidual / Math.pow(1 + tasa, meses);
            const cuota = (valorActivo - valorFuturo) * tasa / (1 - Math.pow(1 + tasa, -meses));
            const totalPagos = cuota * meses + valorResidual;
            resultadoHTML = `
                <h3>Resultado Leasing</h3>
                <p>Cuota mensual: <span>$${formatearNumero(cuota)}</span></p>
                <p>Valor residual al final: <span>$${formatearNumero(valorResidual)}</span></p>
                <p>Total pagado: <span>$${formatearNumero(totalPagos)}</span></p>`;
        } else if (tipo === 'capital_trabajo') {
            const monto = parseFloat(document.getElementById('montoCapital').value);
            const tasa = parseFloat(document.getElementById('tasaCapital').value) / 100;
            const dias = parseInt(document.getElementById('plazoCapital').value);
            const costo = monto * tasa * dias / 360;
            const tasaMensual = (Math.pow(1 + tasa, 30/360) - 1) * 100;
            resultadoHTML = `
                <h3>Resultado Capital de Trabajo</h3>
                <p>Interés a pagar: <span>$${formatearNumero(costo)}</span></p>
                <p>Monto total a devolver: <span>$${formatearNumero(monto + costo)}</span></p>
                <p>Tasa equivalente mensual: <span>${tasaMensual.toFixed(2)}%</span></p>`;
        }
        
        document.getElementById('resultado').innerHTML = resultadoHTML;
        document.getElementById('resultado').classList.remove('oculto');
    });
</script>
</body>
</html>
